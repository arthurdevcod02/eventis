<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prestataire — Eventis</title>
  <meta name="description" content="Fiche prestataire Eventis : galerie, services & tarifs, avis clients et demande de devis en quelques clics.">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('eventis_theme')||''}catch(e){}</script>
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages/prestataire.css">
  <script src="/assets/vendor/gsap.min.js" defer></script>
  <script src="/assets/vendor/ScrollTrigger.min.js" defer></script>
  <script src="/assets/vendor/supabase-js.min.js" defer></script>
  <script src="/assets/js/core/auth-supabase.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main id="main">
    <div class="container">
      <a class="btn btn--ghost btn--sm provider-back" href="/catalogue.html">← Retour au catalogue</a>
    </div>

    <!-- Galerie : image couverture + miniatures éventuelles -->
    <section class="container provider-gallery" id="provider-gallery" aria-label="Galerie photos" data-reveal>
      <div class="provider-hero">
        <img id="hero-image" src="" alt="" width="1600" height="900">
      </div>
      <div class="provider-gallery__thumbs" id="gallery-thumbs" hidden></div>
    </section>

    <div class="container">
      <!-- En-tête de la fiche : nom, badge, localisation, note, contacts -->
      <header class="provider-head" id="provider-head"></header>

      <div class="provider-layout">
        <div class="provider-main">
          <section class="provider-section" id="services" aria-labelledby="services-title" data-reveal>
            <h2 id="services-title">Services &amp; tarifs</h2>
            <div class="table-wrap" id="services-wrap">
              <table class="table price-table">
                <thead>
                  <tr>
                    <th scope="col">Prestation</th>
                    <th scope="col" class="price-table__price">Prix</th>
                  </tr>
                </thead>
                <tbody id="services-body"></tbody>
              </table>
            </div>
            <p class="muted" id="services-empty" hidden>Aucun tarif publié pour le moment — demandez un devis.</p>
          </section>

          <section class="provider-section" id="about" aria-labelledby="about-title" data-reveal>
            <h2 id="about-title">À propos</h2>
            <p id="about-text"></p>
          </section>

          <section class="provider-section" id="reviews" aria-labelledby="reviews-title" data-reveal>
            <h2 id="reviews-title">Avis</h2>
            <div id="reviews-list" class="reviews-list"></div>
          </section>
        </div>

        <aside class="provider-aside">
          <div id="quote-slot"></div>
        </aside>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="/assets/js/pages/prestataire.js"></script>
</body>
</html>
