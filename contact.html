<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Eventis</title>
  <meta name="description" content="Contactez l'équipe Eventis : une question, une suggestion ou un partenariat, écrivez-nous via le formulaire de contact.">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('eventis_theme')||''}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F97316">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <style>
    /* Page contact — ajustements minimaux, tokens uniquement */
    .contact-form { max-width: 640px; margin-top: var(--space-5); }
    .contact-demo { margin: var(--space-2) 0 var(--space-4); font-size: .875rem; }
    .contact-alt { margin-top: var(--space-4); }
  </style>
  <script src="/assets/vendor/gsap.min.js" defer></script>
  <script src="/assets/vendor/ScrollTrigger.min.js" defer></script>
  <script src="/assets/vendor/supabase-js.min.js" defer></script>
  <script src="/assets/js/core/auth-supabase.js" defer></script>
</head>
<body data-nav-active="contact">
  <header id="site-header"></header>
  <main id="main">
    <section class="section">
      <div class="container">
        <h1>Contact</h1>
        <p class="muted">Une question, une suggestion ou une envie de collaborer ? Écrivez-nous, l'équipe Eventis vous répond.</p>
        <form id="contact-form" class="contact-form" action="#" method="post">
          <div class="field">
            <label for="c-name">Nom</label>
            <input id="c-name" name="name" type="text" autocomplete="name" required maxlength="120">
          </div>
          <div class="field">
            <label for="c-email">E-mail</label>
            <input id="c-email" name="email" type="email" autocomplete="email" required maxlength="190">
          </div>
          <div class="field">
            <label for="c-message">Message</label>
            <textarea id="c-message" name="message" rows="6" required minlength="10" maxlength="2000"></textarea>
          </div>
          <p id="contact-demo-note" class="contact-demo muted" hidden>Mode démonstration : votre message est enregistré localement et ne sera pas transmis.</p>
          <button class="btn btn--primary" type="submit">Envoyer le message</button>
        </form>
        <p class="muted contact-alt">Vous pouvez aussi écrire directement à <a href="mailto:nandjanakpane@gmail.com">nandjanakpane@gmail.com</a> ou sur WhatsApp au +228 93 83 85 93.</p>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="/assets/js/pages/contact.js"></script>
</body>
</html>
