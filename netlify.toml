# Configuration Netlify — Eventis (site statique multi-pages, aucun framework).
#
# Le dépôt ne se publie pas tel quel : `node tools/build-dist.mjs` assemble dans `dist/`
# uniquement les pages et les ressources du site. Sans cette étape, `node_modules` (32 Mo),
# les scripts SQL, les tests et la documentation d'agent partiraient en ligne.

[build]
  command = "node tools/build-dist.mjs"
  publish = "dist"

# Le mode maintenance est appliqué par netlify/edge-functions/maintenance.js, dont la
# route est déclarée dans le fichier lui-même (`export const config`) : c'est le seul
# endroit du site qui décide de servir une page ou la page de coupure. Son réglage vit
# dans la table Supabase `site_settings`, pas dans ce fichier.
# ATTENTION : cette fonction lit SUPABASE_URL et SUPABASE_ANON_KEY au moment de l'exécution.
# Ces variables doivent donc porter la portée « Functions » dans l'interface Netlify — les
# variables déclarées ci-dessous ne sont jamais visibles d'une fonction, et une valeur
# changée dans l'interface exige un nouveau déploiement pour être reprise.

[build.environment]
  # L'outil de build est un module ES avec `await` au premier niveau : Node ≥ 20.
  NODE_VERSION = "22"

# Les URLs du site portent l'extension .html (/auth/connexion.html) et c'est cette URL exacte
# qui est déclarée comme retour OAuth chez Supabase. Les « pretty URLs » de Netlify réécriraient
# en /auth/connexion : un saut de plus, et un retour qui ne correspond plus à l'URL autorisée.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/sw.js"
  [headers.values]
    # Le service worker est le seul fichier à toujours revalider : c'est lui qui décide du reste
    # du cache. Un sw.js gardé en cache = des visiteurs coincés sur une version fanée.
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
